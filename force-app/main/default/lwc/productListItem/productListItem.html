<template>
    <lightning-layout vertical-align="center">
        <lightning-layout-item><img src={product.Picture_URL__c} class="product"
                alt="Product picture" /></lightning-layout-item>
    </lightning-layout flexibility="grow" class="slds-var-p-horizontal_small">
    <p>{product.Name}</p>
    <P>
        <lightning-formatted-number format-style="currency" currency-code="RS" value={product.MSRP__c} class="price"
            maximum-fraction-digits="0"></lightning-formatted-number>
    </P>
    </lightning-layout-item>
    <lightning-layout-item><lightning-button label="View Details"
            onclick={handleViewDetailsClick}></lightning-button></lightning-layout-item>
    </lightning-layout>
</template>
